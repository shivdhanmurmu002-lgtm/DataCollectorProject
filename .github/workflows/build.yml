name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 🔧 Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: 📦 Setup Gradle 8.2 (Fixed Version)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
    
    - name: 🔨 Create Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2 --distribution-type all
        chmod +x gradlew
        ls -la
    
    - name: 📋 Verify Setup
      run: |
        echo "Java version:"
        java -version
        echo ""
        echo "Gradle version:"
        ./gradlew --version
        echo ""
        echo "Files in project:"
        ls -la
    
    - name: 🏗️ Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon
    
    - name: 📱 Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk DataCollector.apk
        ls -lh DataCollector.apk
    
    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DataCollector-APK
        path: DataCollector.apk
        retention-days: 30
    
    - name: ✅ Success Message
      run: |
        echo "════════════════════════════════"
        echo "  🎉 APK Built Successfully!"
        echo "════════════════════════════════"
