name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
    
    - name: Create Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2 --distribution-type all
        chmod +x gradlew
    
    - name: List all XML files (for debugging)
      run: |
        echo "=== All XML files in project ==="
        find app/src/main/res -name "*.xml" -exec echo "File: {}" \;
        echo ""
        echo "=== Checking for problematic characters ==="
        grep -rn '&' app/src/main/res --include="*.xml" | head -20 || echo "No & characters found"
    
    - name: Build Debug APK with detailed logs
      run: ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -200
    
    - name: Show build errors
      if: failure()
      run: |
        echo "=== Looking for errors ==="
        find . -name "*.txt" -path "*/reports/*" -exec cat {} \; 2>/dev/null | head -100 || true
        echo ""
        echo "=== Problems report ==="
        find . -name "problems-report.html" -exec cat {} \; 2>/dev/null | head -100 || true
    
    - name: Rename APK
      if: success()
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk DataCollector.apk
        ls -lh DataCollector.apk
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: DataCollector-APK
        path: DataCollector.apk
        retention-days: 30
